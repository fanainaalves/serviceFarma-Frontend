<div class="container">
  <div class="card mt-4">
    <h4 class="card-header">Listagem de Medicamentos</h4>
    <div class="card-body">
      <!-- Formulário de pesquisa -->
      <form class="mb-3" role="search">
        <input type="search" class="form-control" placeholder="Nome ou Código" (input)="applyFilter($event)">
      </form>

      <!-- Seletor de Itens por Página -->
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <div>
          <label for="pageSizeSelect" class="me-2">Itens por página:</label>
          <select id="pageSizeSelect" class="form-select d-inline-block w-auto" (change)="onPageSizeChange($event)">
            <option *ngFor="let size of [5, 10, 20]" [value]="size">{{size}}</option>
          </select>
        </div>
        <div>
          <strong>Total de itens: {{totalItems}}</strong>
        </div>
      </div>

      <!-- Tabela -->
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Título</th>
            <th>Tipo</th>
            <th>Quantidade</th>
            <th>Código</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of dataSource.data">
            <td>{{product.title}}</td>
            <td>{{product.type}}</td>
            <td>{{product.amount}}</td>
            <td>{{product.code}}</td>
            <td>
              <button class="btn btn-primary btn-sm" (click)="editProduct(product)" *ngIf="hasPermissionToEdit">
                <i class="bi bi-pencil-square"></i> Editar
              </button>
              <button class="btn btn-danger btn-sm" (click)="deleteProduct(product)" *ngIf="hasPermissionToDelete">
                <i class="bi bi-dash-square"></i> Excluir
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Paginação -->
      <nav>
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <a class="page-link" (click)="onPageChange(currentPage - 1)">Anterior</a>
          </li>
          <li class="page-item" *ngFor="let page of getPagesArray()" [class.active]="page === currentPage">
            <a class="page-link" (click)="onPageChange(page)">{{page}}</a>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <a class="page-link" (click)="onPageChange(currentPage + 1)">Próximo</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
