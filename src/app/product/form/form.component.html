<div class="container mt-5">
  <div class="card">
    <div class="card-header">
      <h4>{{ isEdit ? 'Editar Medicamento' : 'Cadastrar Medicamento' }}</h4>
    </div>
    <div class="card-body">
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

        <!-- Título -->
        <div class="mb-3">
          <label for="title" class="form-label">Título</label>
          <input type="text" id="title" class="form-control" formControlName="title" required>
        </div>

        <!-- Tipo -->
        <div class="mb-3">
          <label for="type" class="form-label">Tipo</label>
          <select id="type" class="form-select" formControlName="type" required>
            <option *ngFor="let type of productTypes" [value]="type">{{ type }}</option>
          </select>
        </div>

        <!-- Quantidade -->
        <div class="mb-3">
          <label for="amount" class="form-label">Quantidade</label>
          <input type="number" id="amount" class="form-control" formControlName="amount" required min="1">
        </div>

        <!-- Código -->
        <div class="mb-3">
          <label for="code" class="form-label">Código</label>
          <input type="number" id="code" class="form-control" formControlName="code" required>
        </div>

        <!-- Botões -->
        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-primary">{{ isEdit ? 'Salvar' : 'Cadastrar' }}</button>
          <button type="button" class="btn btn-danger" (click)="cancel()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
