<div class="container">
  <div class="card mt-2">
    <h4 class="card-header">Listagem de Medicamentos</h4>
    <div class="card-body">

      <!-- Seletor de Tipo -->
      <div class="mb-3">
        <label for="typeSelect" class="form-label">Tipo:</label>
        <select id="typeSelect" class="form-select" [(ngModel)]="searchBy" (change)="loadProducts(1, pageSize, searchValue, searchBy)">
          <option value="">Todos</option>
          <option value="CARTELA">CARTELA</option>
          <option value="CAIXA">CAIXA</option>
          <option value="UNIDADE">UNIDADE</option>
          <!-- Adicione outros tipos conforme necessário -->
        </select>
      </div>
      <!-- Formulário de pesquisa -->
       <div class="input-group input-group-sm mb-3" role="search">
        <span class="input-group-text" id="inputGroup-sizing-default"><i class="bi bi-search"></i></span>
        <input aria-label="Sizing example input" aria-describedby="inputGroup-sizing-default" type="search" class="form-control" placeholder="insira um Título ou Código para pesquisar" (input)="applyFilter($event)">
      </div>
      <!-- Seletor de Itens por Página -->
      <div class="mb-3 d-flex justify-content-between align-items-center">
        <div>
          <label for="pageSizeSelect" class="me-2">Itens por página:</label>
          <select id="pageSizeSelect" class="form-select d-inline-block w-auto" (change)="onPageSizeChange($event)">
            <option *ngFor="let size of [5, 10, 20]" [value]="size">{{size}}</option>
          </select>
        </div>
        <div>
          <strong>Total de itens: {{totalItems}}</strong>
        </div>
        <div>
          <button class="btn btn-success btn-sm" (click)="addNewProduct()" *ngIf="hasPermissionToAdd">
            <i class="bi bi-plus-square"></i> Adicionar Produto
          </button>
        </div>
      </div>

      <!-- Tabela -->
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Título</th>
            <th>Tipo</th>
            <th>Quantidade</th>
            <th>Código</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let product of dataSource.data">
            <td>{{product.title}}</td>
            <td>{{product.type}}</td>
            <td>{{product.amount}}</td>
            <td>{{product.code}}</td>
            <td>
              <button class="btn btn-primary btn-sm" (click)="editProduct(product)" *ngIf="hasPermissionToEdit">
                <i class="bi bi-pencil-square"></i> Editar
              </button>
              <button class="btn btn-danger btn-sm" (click)="deleteProduct(product)" *ngIf="hasPermissionToDelete">
                <i class="bi bi-dash-square"></i> Excluir
              </button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Paginação -->
      <nav>
        <ul class="pagination justify-content-center">
          <li class="page-item" [class.disabled]="currentPage === 1">
            <a class="page-link" (click)="onPageChange(currentPage - 1)">Anterior</a>
          </li>
          <li class="page-item" *ngFor="let page of getPagesArray()" [class.active]="page === currentPage">
            <a class="page-link" (click)="onPageChange(page)">{{page}}</a>
          </li>
          <li class="page-item" [class.disabled]="currentPage === totalPages">
            <a class="page-link" (click)="onPageChange(currentPage + 1)">Próximo</a>
          </li>
        </ul>
      </nav>
    </div>
  </div>
</div>
