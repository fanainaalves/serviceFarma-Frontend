<div class="container">
  <mat-card-title>Listagem de Medicamentos</mat-card-title>
  <!-- <div class="busca">
    Buscar medicamentos
    <input type="text" placeholder="Digite o título ou código para pesquisar..." (input)="applyFilter($event)">
  </div> -->
<!--
  <div *ngIf="hasPermissionToAdd" class="add-button">
    <button mat-raised-button color="primary" (click)="addNewProduct()">Adicionar Medicamento</button>
  </div> -->

  <div class="container">
    <div class="row">
      <button> <!--(click)="createProduct()"> -->
        <i class="bi bi-file-plus-fill"></i> Adicionar medicamentos
      </button>
    </div>
  </div>
  <div class="mat-elevation-z8">
    <form action="" role="search">
      <input type="search" placeholder="Nome ou Código">
    </form>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> Título </th>
        <td mat-cell *matCellDef="let product"> {{product.title}} </td>
      </ng-container>

      <ng-container matColumnDef="type">
        <th mat-header-cell *matHeaderCellDef> Tipo </th>
        <td mat-cell *matCellDef="let product"> {{product.type}} </td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef> Quantidade </th>
        <td mat-cell *matCellDef="let product"> {{product.amount}} </td>
      </ng-container>

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef> Código </th>
        <td mat-cell *matCellDef="let product"> {{product.code}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let product">
          <!-- <button mat-button (click)="viewProduct(product)" *ngIf="!hasPermissionToEdit">Visualizar</button> -->
          <button mat-button (click)="editProduct(product)" *ngIf="hasPermissionToEdit">
            <i class="bi bi-pencil-square"></i>
            Editar
          </button>
          <button mat-button (click)="deleteProduct(product)" *ngIf="hasPermissionToDelete">
            <i class="bi bi-dash-square"></i>
            Excluir
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
  </div>
</div>
